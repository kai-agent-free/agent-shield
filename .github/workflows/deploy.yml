# 🌰 AgentShield — AI Infrastructure Threat Intelligence Pipeline
name: "🌰 Deploy AgentShield"

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 12 * * 0'  # 🌰 Weekly on Sunday at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: "🌰 Checkout"
        uses: actions/checkout@v4

      - name: "🌰 Setup Node.js"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "🌰 Fetch threat data from CPW API"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/api-call.js
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: "🌰 Run AI threat analysis (GitHub Models)"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/ai-analysis.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "🌰 Commit updated intelligence"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AgentShield Bot 🌰"
          git add data/events.json
          if ! git diff --staged --quiet; then
            git commit -m "🌰 Weekly threat intelligence update — $(date -u '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: "🌰 Setup GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "🌰 Upload Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: "🌰 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
